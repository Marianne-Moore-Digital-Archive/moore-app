<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content-notebooks.html"
        },
        "urls": {
            "ignore": ["selectors", "view", "odd"]
        },
        "features": {
            "toolbar" : {
                "metadata": true,
                "viewXML": true
            },
            "iiif": {
                "viewer": "pb-facsimile",
                "enabled": true,
                "type": "image"
            }
        },
        "styles": [
            "resources/css/edition.css"
        ]
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li>
                    <a href="[[ $context-path ]]/browse.html?collection=[[ browse:parent-link($context) ]]">Notebooks</a>
                </li>
                <li>[[ $doc?transform($doc?content//*:titleStmt, map { "mode": "breadcrumb" }) ]]</li>
                <li> 
                    <pb-view id="breadcrumbPageNumber" src="document1" subscribe="transcription">
                        <pb-param name="mode" value="title"/>
                    </pb-view>
                </li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]
    <div class="content-body">
        <pb-view class="overflow" src="document1" column-separator=".tei-cb" subscribe="transcription" emit="transcription"/>
    </div>
</template>
