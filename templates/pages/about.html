<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content-about.html"
        },
        "urls": {
            "ignore": "selectors"
        },
        "features":
            {
                "toc": {
                    "disabled": true
                }
            }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li>
                   [[ $doc?transform-with($doc?content//tei:teiHeader/tei:fileDesc/tei:titleStmt/tei:title[1], map { "mode": "breadcrumb" }, "about.odd") ]]
                </li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]
    <pb-view class="overflow" src="document1" column-separator=".tei-cb" append-footnotes="append-footnotes" subscribe="transcription" emit="transcription"/>
</template>
