<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/base.html"
        }
    }
    ---
    [% template breadcrumb %]

    [% endtemplate %]

    [% template before %]
    <h5>Sections</h5>
    <pb-load class="toc" url="api/sections/{doc}?target=transcription" expand="expand" src="document1" load-once="load-once" auto="auto">
        <pb-i18n key="dialogs.loading">Loading</pb-i18n>
    </pb-load>
    [% endtemplate %]

    [% block above-content %][% endblock %]
    
    [% template after %]
    [% if $context?features?toc?enabled and exists($context?doc)%]
    <h5>Contents</h5>
    <pb-load class="toc" url="api/document/{doc}/contents?target=transcription" expand="expand" src="document1" subscribe="toc" load-once="load-once" auto="auto">
        <pb-i18n key="dialogs.loading">Loading</pb-i18n>
    </pb-load>
    [% endif %]
    [% endtemplate %]
    <main>
        <!-- Content block -->
        [% block content %][% endblock %]
    </main>
    [% block below-content %][% endblock %]
    [% if exists($context?doc) %]
    <pb-document id="document1" path="[[ $context?doc?path ]]" odd="[[ $context?doc?odd ]]" view="[[ $context?doc?view ]]" root-path="[[ $config:data-root ]]" source-view="[[ $page:EXIDE ]]"/>
    [% endif %]
</template>
