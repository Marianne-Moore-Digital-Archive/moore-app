<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/base.html"
        }
    }
    ---
    [% template before %]
    <h5>
        <pb-i18n key="document.contents">Contents</pb-i18n>
    </h5>
    <pb-load class="toc" url="api/toc-by-page/{doc}?target=transcription&amp;icons=true[[ if ($context?features?toc?collapse) then '&amp;collapse=true' else '' ]]" expand="expand" src="document1" subscribe="toc" load-once="load-once" auto="auto">
            <pb-i18n key="dialogs.loading">Loading</pb-i18n>
    </pb-load>
    [% endtemplate %]
    <main>
        <!-- Content block -->
        [% block content %][% endblock %]
    </main>
    [% if exists($context?doc) %]
    <pb-document id="document1" path="[[ $context?doc?path ]]" odd="[[ $context?doc?odd ]]" view="[[ $context?doc?view ]]" root-path="[[ $config:data-root ]]" source-view="[[ $page:EXIDE ]]"/>
    [% endif %]
</template>
